spring:
  application:
    name: ecommerce-backend

  # Carga el .env de la raiz del repositorio, el mismo que lee docker-compose. El sufijo
  # [.properties] le indica a Spring como interpretarlo, y 'optional:' evita que el arranque falle
  # cuando no existe (por ejemplo dentro del contenedor, donde las variables llegan del entorno).
  # Las variables de entorno reales siguen teniendo prioridad sobre este archivo.
  config:
    import: optional:file:../.env[.properties]

  # Ojo: en Spring Boot 4 la conexion se configura en 'spring.mongodb', no en 'spring.data.mongodb'.
  # Esta ultima ya no controla el servidor y su valor por defecto es 'mongodb://localhost/test', asi
  # que si se configura en el sitio antiguo la aplicacion se conecta al 27017 y escribe en la base
  # 'test' sin dar ningun aviso.
  mongodb:
    # El 27018 es el puerto que publica docker-compose (ver ahi el motivo).
    uri: ${MONGO_URI:mongodb://ecommerce:ecommerce@127.0.0.1:27018/ecommerce?authSource=admin}
    # Nombre de base explicito, para no depender de que se lea de la ruta de la URI.
    database: ${MONGO_DATABASE:ecommerce}

  data:
    mongodb:
      auto-index-creation: false   # los indices se declaran explicitamente en MongoIndexConfig

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # Mailpit no pide autenticacion ni cifrado; un SMTP real como Gmail exige ambos.
      # Por eso son configurables: con MAIL_SMTP_AUTH=true y MAIL_SMTP_STARTTLS=true se envia
      # correo de verdad sin tocar el codigo.
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  thymeleaf:
    check-template-location: true

server:
  port: 8080

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  mail-from: ${MAIL_FROM:no-reply@ecommerce.local}
  seed-demo-data: ${APP_SEED_DEMO_DATA:true}

  jwt:
    # Clave HS256. Se sobreescribe siempre por variable de entorno fuera de desarrollo.
    secret: ${JWT_SECRET:desarrollo-local-clave-insegura-cambiar-en-produccion-minimo-64-caracteres}
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}

  nlp:
    url: ${NLP_SERVICE_URL:http://localhost:8000}
    timeout-ms: ${NLP_SERVICE_TIMEOUT_MS:4000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ecommerce: DEBUG
