<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/layout :: page('Código de acceso', ~{::content})}">
<body>
<div th:fragment="content" th:remove="tag">
  <h1 style="margin:0 0 24px;font-size:28px;font-weight:400;line-height:1.3;">Código de verificación</h1>
  
  <p style="margin:0 0 16px;font-size:15px;line-height:1.7;color:#3A3835;">
    Hola <strong th:text="${name}">Nombre</strong>,
  </p>
  
  <p style="margin:0 0 16px;font-size:15px;line-height:1.7;color:#3A3835;">
    Has solicitado ingresar a tu cuenta. Usa el siguiente código para completar el acceso:
  </p>

  <div style="background:#F7F4EF; padding:24px; text-align:center; font-size:32px; letter-spacing:8px; font-weight:bold; color:#1A1A1A; border:1px solid #E3DDD4; margin:24px 0;" 
       th:text="${code}">
    000000
  </div>

  <p style="margin:0;font-size:13px;line-height:1.7;color:#6B6862;">
    Este código expirará en 10 minutos por seguridad. Si no intentaste iniciar sesión, puedes ignorar este mensaje.
  </p>
</div>
</body>
</html>
