<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/layout :: page('Tu cuenta ya esta activa', ~{::content})}">
<body>
<div th:fragment="content" th:remove="tag">
  <h1 style="margin:0 0 24px;font-size:28px;font-weight:400;line-height:1.3;">Tu cuenta ya esta activa</h1>
  <p style="margin:0 0 16px;font-size:15px;line-height:1.7;color:#3A3835;">
    Hola <strong th:text="${name}">Nombre</strong>, confirmamos tu correo correctamente.
  </p>
  <p style="margin:0 0 32px;font-size:15px;line-height:1.7;color:#3A3835;">
    Ya puedes iniciar sesion y explorar el catalogo. Te recomendamos activar la verificacion en dos
    pasos desde tu cuenta para proteger tu sesion.
  </p>
  <table role="presentation" cellpadding="0" cellspacing="0"><tr><td>
    <a th:href="${link}" href="#"
       style="display:inline-block;padding:14px 32px;background:#1A1A1A;color:#FFFFFF;text-decoration:none;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;">
      Ver productos
    </a>
  </td></tr></table>
</div>
</body>
</html>
